<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Panel zadań</title>
</head>
<body>
    <header>
        <h1 id="page-title">Panel zadań</h1>
        <p class="description">Lista rzeczy do wykonania</p>
    </header>

    <main id="app">
        <section id="task-section">
            <h2>Moje zadania</h2>

            <ul class="task-list">
                <li class="task">Przygotować prezentację</li>
                <li class="task important">Oddać projekt</li>
                <li class="task">Powtórzyć JavaScript</li>
                <li class="task important">Sprawdzić termin sprawdzianu</li>
            </ul>
        </section>

        <aside id="summary">
            <h2>Podsumowanie</h2>
            <p class="task-count">Liczba zadań: 4</p>
        </aside>
    </main>

    <footer>
        <p>Moja aplikacja</p>
    </footer>
</body>
</html>
